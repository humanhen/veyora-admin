  <!-- NO EXTERNAL FONT CDN. Montserrat used to be fetched from Google Fonts
       on every page of this AUTHENTICATED portal, which meant a third-party
       request carrying the visitor's IP and Referer on every screen a
       signed-in trade customer opened, plus a hard dependency on a host
       Veyora does not run for the page to render as designed.

       The font stack in store.css names Montserrat first, so a machine that
       already has it still uses it, and falls back to system faces otherwise.
       No font binary was added: the commercial faces excluded during the
       branch integration remain excluded, for the same licensing reason. -->
  <link rel="stylesheet" href="css/store.css" />
  <!-- ANALYTICS: DISABLED BY DEFAULT.

       A Meta Pixel used to load here, carried over from the old marketing
       site. It was removed, not merely switched off.

       This is the AUTHENTICATED B2B portal, not a marketing page. The pixel
       initialised on every load and fired a PageView on every in-app route
       change, so a signed-in trade customer's entire session — which frames
       they looked at, what they ordered, how often they came back — was sent
       to a third party. There was no consent gate, and it ran with a
       hard-coded production pixel id. A third-party script in an authenticated
       page also has full access to the DOM and the session it renders in.

       Nothing replaces it. There is deliberately no dormant hook and no
       configuration flag holding the id, because a hidden id that only
       something else prevents from executing is one line away from executing
       again.

       Activating any analytics here in future is a business and privacy
       decision, not a code change made in passing. It needs an explicit
       configured id (never committed), a consent mechanism appropriate to the
       jurisdictions Veyora's customers trade in, and a decision about whether
       tracking signed-in commercial behaviour is acceptable at all. -->
</head>
