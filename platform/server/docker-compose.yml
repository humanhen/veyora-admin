services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: veyora
      POSTGRES_USER: veyora
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veyora -d veyora"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://veyora:${DB_PASSWORD}@db:5432/veyora
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      UPLOADS_DIR: /uploads
      IMPORT_DIR: /import
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Veyora <info@veyora.com>}
      # DEPRECATED. Kept so an existing .env keeps working: src/origins.js
      # accepts it as a fallback for PORTAL_ORIGIN and logs a deprecation.
      # It no longer influences cookie security in any way (finding AUTH-002).
      # The bare-IP default is pre-existing and is declared in the release
      # gate's host-scan exception list rather than changed unattended.
      PUBLIC_URL: ${PUBLIC_URL:-http://209.46.125.226}
      # Where portal and admin links point. Falls back to PUBLIC_URL when
      # unset, so this is additive for an existing deployment — but set it
      # explicitly before the cutover, because that is the moment PUBLIC_URL
      # stops meaning "the portal".
      PORTAL_ORIGIN: ${PORTAL_ORIGIN:-}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-}
      # Session-cookie security. Explicit, and never derived from a link
      # variable. Unset it and production defaults to Secure.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # Reverse-proxy hops in front of the API. One (Caddy) in this topology.
      # Do NOT raise this without adding a proxy: each hop is one more
      # X-Forwarded-For entry a client could forge to choose its own req.ip.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      INGEST_KEY: ${INGEST_KEY:-}
      ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID:-}
      ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET:-}
      ZOHO_REFRESH_TOKEN: ${ZOHO_REFRESH_TOKEN:-}
      ZOHO_ORG_ID: ${ZOHO_ORG_ID:-875980504}
      ZOHO_DC: ${ZOHO_DC:-com}
      ZOHO_SYNC_MINUTES: ${ZOHO_SYNC_MINUTES:-30}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SCAN_MODEL: ${SCAN_MODEL:-claude-haiku-4-5-20251001}
      ALLOW_CUSTOMER_BACKORDERS: ${ALLOW_CUSTOMER_BACKORDERS:-true}
      ORDER_ALERT_EMAILS: ${ORDER_ALERT_EMAILS:-}
    volumes:
      - uploads:/uploads
      - ./data/import:/import
    depends_on:
      db:
        condition: service_healthy
    # /health does `select 1`, so a pass means the API can actually reach the
    # database — not merely that the process is listening. `web` and `caddy`
    # wait on this rather than on "the container started", which is the
    # distinction that stops a deploy reporting success against a stack that
    # cannot serve a request.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # The public Astro website (Fast-Track Workstream 2). Additive: it builds and
  # runs, but receives no traffic until Caddy is pointed at it — see
  # Caddyfile.rc and docs/public-website-rebuild/26_RELEASE_DEPLOYMENT_ARCHITECTURE.md.
  web:
    build: ./web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Internal service name only. This origin is used server-side by the
      # Astro server and must never reach public HTML — the site posts forms
      # to its own path and calls the API from the server for exactly that
      # reason.
      PUBLIC_API_ORIGIN: http://api:3000
      # Required, and deliberately without a default: the container's own
      # validate-env.mjs gate refuses to start without them, which is the
      # behaviour we want. A default here would silently serve a wrong
      # canonical host and break form CSRF.
      PUBLIC_SITE_ORIGIN: ${PUBLIC_SITE_ORIGIN:?PUBLIC_SITE_ORIGIN is required}
      PORTAL_ORIGIN: ${PORTAL_ORIGIN:?PORTAL_ORIGIN is required}
      HOST: 0.0.0.0
      PORT: 4321
    # No published ports: the site is reachable only through Caddy.
    expose:
      - "4321"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4321/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
      # Used only by Caddyfile.rc (the release-candidate topology). Empty
      # defaults keep the current Caddyfile working unchanged.
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-}
    volumes:
      # CADDYFILE selects which topology is live. It defaults to the current,
      # unchanged Caddyfile, so a deploy cannot cut over by accident; the RC
      # topology is opted into by setting CADDYFILE=./Caddyfile.rc in .env.
      # Cutover and rollback are therefore one line plus a reload.
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./storefront:/srv/storefront:ro
      - ./admin:/srv/admin:ro
      - uploads:/srv/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
